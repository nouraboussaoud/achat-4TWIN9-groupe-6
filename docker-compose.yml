services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: achatdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - achat_network
  
  backend:
    image: achat-backend-nouraboussaoud-4twin9
    container_name: backend-app
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/achatdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8089:8089"
    volumes:
      - ./logs:/logs  # Monter le volume pour les logs
    networks:
      - achat_network
    restart: on-failure
  
  frontend:
    image: achat-frontend-nouraboussaoud-4twin9
    container_name: frontend-app
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    networks:
      - achat_network
    depends_on:
      - backend

networks:
  achat_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  backend_logs:  # Nouveau volume pour les logs du backend
    driver: local